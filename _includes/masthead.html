{% include base_path %}

<style>
  /* 1. Glassmorphism & Dropdown Styling */
  .spotify-dropdown {
    max-height: 0;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
    /* Glass Effect */
    background: rgba(255, 255, 255, 0.05); 
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .spotify-dropdown.is-open {
    max-height: 120px; /* Adjust based on embed height */
    padding: 10px 0;
  }

  .spotify-container {
    max-width: 1280px; /* Matches standard Masthead width */
    margin: 0 auto;
    padding: 0 1em;
  }

  /* 2. Button Styling */
  #spotify-toggle i {
    color: #1DB954; /* Spotify Green */
    transition: transform 0.2s ease;
    cursor: pointer;
  }

  #spotify-toggle:hover i {
    transform: scale(1.1);
    filter: brightness(1.2);
  }
</style>

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}

          <li id="spotify-toggle" class="masthead__menu-item persist">
            <a role="button" aria-label="Toggle Spotify Player">
              <i class="fa-brands fa-spotify" aria-hidden="true"></i>
            </a>
          </li>

          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon">
              <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i>
            </a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>

  <div id="spotify-drawer" class="spotify-dropdown">
    <div class="spotify-container">
      <iframe 
        style="border-radius:12px" 
        src="https://open.spotify.com/embed/playlist/2opUnp7ERG11zZErpbjwk5?utm_source=generator&theme=0" 
        width="100%" 
        height="80" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>
  </div>
</div>

<script>
  // 3. Simple Toggle Logic
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('spotify-toggle');
    const drawer = document.getElementById('spotify-drawer');

    btn.addEventListener('click', function(e) {
      e.preventDefault();
      drawer.classList.toggle('is-open');
    });
  });
</script>
