<header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <!-- Site Title / Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a href="{{ '/' | relative_url }}" class="text-xl font-extrabold text-indigo-600 hover:text-indigo-800 transition-colors">
          {{ site.title }}
        </a>
      </div>
      
      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex space-x-8">
        {% for link in site.data.navigation.main %}
          <a href="{{ link.url | relative_url }}" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
            {{ link.title }}
          </a>
        {% endfor %}
      </nav>

      <!-- Mobile Menu Icon (Visual Only) -->
      <div class="md:hidden flex items-center">
        <button type="button" class="text-gray-500 hover:text-gray-900 focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>

    </div>
  </div>
</header>
