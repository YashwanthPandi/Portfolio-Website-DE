<style>
  /* ====== 1. UNIFIED MASTHEAD LAYOUT ====== */
  .masthead {
    background: #1e222b !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
    z-index: 20;
  }

  .masthead__inner-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1.5em;
  }

  .masthead__top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px; /* single consistent header height */
  }

  /* Logo / brand area */
  .masthead__brand {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .masthead__logo-link {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .site-logo {
    height: 32px;
    width: auto;
    /* If your logo.svg is drawn in black, this makes it visible on the dark bar.
       Remove this line if your logo is already white/light. */
    filter: brightness(0) invert(1);
  }

  /* Nav area */
  .masthead__nav-bar {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .greedy-nav .visible-links {
    display: flex;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 1.75em;
  }

  .masthead__menu-item {
    display: flex;
    align-items: center;
  }

  .masthead__menu-item a {
    color: #e4e4e7 !important; /* zinc-200 */
    font-weight: 500;
    text-decoration: none !important;
    font-size: 0.95em;
    transition: color 0.2s ease;
  }

  .masthead__menu-item a:hover {
    color: #f4c430 !important; /* accent yellow, matches hero */
  }

  /* Persist items (spotify icon, theme toggle, button) sit at consistent
     vertical center regardless of surrounding link height */
  .masthead__menu-item.persist {
    display: flex;
    align-items: center;
  }

  .masthead__menu-item.persist button {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 0;
  }

  #theme-icon {
    color: #e4e4e7;
    font-size: 1em;
    transition: color 0.2s ease;
  }
  #theme-icon:hover {
    color: #f4c430;
  }

  /* ====== 2. Spotify Dropdown & Glassmorphism ====== */
  .spotify-dropdown {
    max-height: 0;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .spotify-dropdown.is-open {
    max-height: 120px;
    padding: 10px 0;
  }
  .spotify-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1em;
  }
  #spotify-toggle i {
    color: #1DB954;
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  #spotify-toggle:hover i { transform: scale(1.1); filter: brightness(1.2); }

  /* ====== 3. NeetoCal Button Styling — NO UNDERLINE ====== */
  .neetocal-nav-btn {
    background-color: #1DB954 !important;
    color: white !important;
    padding: 6px 15px !important;
    border-radius: 20px !important;
    font-weight: bold !important;
    font-size: 0.8em !important;
    text-transform: uppercase;
    margin-left: 10px;
    display: inline-block;
    vertical-align: middle;
    text-decoration: none !important;
    border: none !important;
    line-height: 1.2 !important;
  }

  .neetocal-nav-btn:hover,
  .neetocal-nav-btn:focus,
  .neetocal-nav-btn:active,
  .visible-links .masthead__menu-item a.neetocal-nav-btn:hover {
    text-decoration: none !important;
    filter: brightness(1.1);
    color: white !important;
    outline: none;
  }

  /* ====== 4. Mobile: stack nav below brand if it overflows ====== */
  @media (max-width: 768px) {
    .masthead__top-bar {
      flex-wrap: wrap;
      height: auto;
      padding: 0.75em 0;
    }
    .greedy-nav .visible-links {
      flex-wrap: wrap;
      gap: 1em 1.25em;
      row-gap: 0.5em;
    }
  }
</style>

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__top-bar">
      <div class="masthead__brand">
        <a href="{{ base_path }}/" class="masthead__logo-link">
          <img src="/images/logo.svg" alt="{{ site.title }}" class="site-logo" />
        </a>
      </div>
      <nav id="site-nav" class="greedy-nav masthead__nav-bar">
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ base_path }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}

          <li id="spotify-toggle" class="masthead__menu-item persist">
            <button type="button" aria-label="Open Spotify drawer"><i class="fa-brands fa-spotify"></i></button>
          </li>

          <li id="theme-toggle" class="masthead__menu-item persist">
            <button type="button" aria-label="Toggle theme"><i id="theme-icon" class="fa-solid fa-sun"></i></button>
          </li>

          <li class="masthead__menu-item persist tail">
            <button id="open-popup-button" class="neetocal-nav-btn" type="button">Schedule a Call</button>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>

  <div id="spotify-drawer" class="spotify-dropdown">
    <div class="spotify-container">
      <iframe
        title="Spotify playlist"
        style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DXbITWG1ZJKYt?utm_source=generator&theme=0"
        width="100%"
        height="80"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </div>
</div>

<script>window.neetoCal = window.neetoCal || { embed: function(){(neetoCal.q=neetoCal.q||[]).push(arguments)} };</script>
<script async src="https://cdn.neetocal.com/javascript/embed.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.neetoCal) {
      neetoCal.embed({
      type: "elementClick",
      id: "489e15b2-35cb-40a7-8076-e080cf6acf38",
      organization: "yashwanth-pandi",
      elementSelector: "#open-popup-button",
      isSidebarAndCoverImgHidden: "false",
      shouldForwardQueryParams: "false"
      });
    }

    const spotifyBtn = document.getElementById('spotify-toggle');
    const drawer = document.getElementById('spotify-drawer');
    if (spotifyBtn && drawer) {
      spotifyBtn.addEventListener('click', function(e) {
        e.preventDefault();
        drawer.classList.toggle('is-open');
      });
    }
  });
</script>
