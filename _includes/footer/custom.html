<footer class="mt-auto border-t bg-white text-slate-600">
  <style>
    footer {
      border-color: rgba(15, 23, 42, 0.1);
      background-color: #ffffff;
      color: #4b5563;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    /* Dark mode for footer */
    html[data-theme="dark"] footer,
    html.dark footer {
      background-color: #0f1419;
      color: #f5f7fb;
      border-color: rgba(255, 255, 255, 0.1);
    }

    footer .text-slate-700 {
      color: #1d2431;
    }

    html[data-theme="dark"] footer .text-slate-700,
    html.dark footer .text-slate-700 {
      color: #f5f7fb;
    }

    footer .text-slate-600 {
      color: #4b5563;
    }

    html[data-theme="dark"] footer .text-slate-600,
    html.dark footer .text-slate-600 {
      color: #d6deea;
    }

    footer a {
      color: #7c6ee6;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #6854d6;
      text-decoration: underline;
    }

    html[data-theme="dark"] footer a,
    html.dark footer a {
      color: #a78bfa;
    }

    html[data-theme="dark"] footer a:hover,
    html.dark footer a:hover {
      color: #c4b5fd;
    }
  </style>

  <div class="mx-auto flex max-w-7xl flex-col items-center gap-3 px-4 py-6 text-center sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8 lg:text-left">
    <div class="text-sm font-medium tracking-wide text-slate-700">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.</p>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-3 text-sm text-slate-600 lg:justify-end">
      {% include social-share.html %}
    </div>
  </div>
</footer>
