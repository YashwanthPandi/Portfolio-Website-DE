<footer class="mt-auto border-t bg-white text-slate-600">
  <style>
    footer {
      border-color: rgba(15, 23, 42, 0.1);
      background-color: #ffffff;
      color: #4b5563;
      transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s ease;
      padding-top: 2.5rem !important;
      padding-bottom: 2rem !important;
      margin-top: 4rem !important;
      position: relative;
      z-index: 10;
      clear: both;
      width: 100%;
    }

    html[data-theme="dark"] footer,
    html.dark footer {
      background-color: #0f1419;
      color: #f5f7fb;
      border-color: rgba(255, 255, 255, 0.1);
    }

    footer .footer-brand,
    footer .footer-meta {
      color: inherit;
    }

    footer .footer-brand {
      font-size: 0.875rem;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    footer .footer-brand p {
      margin: 0;
      font-weight: 600;
    }

    .footer-meta {
      font-size: 0.75rem;
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      opacity: 0.8;
    }

    footer a {
      color: #7c6ee6;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #6854d6;
      text-decoration: underline;
    }

    html[data-theme="dark"] footer a,
    html.dark footer a {
      color: #a78bfa;
    }

    html[data-theme="dark"] footer a:hover,
    html.dark footer a:hover {
      color: #c4b5fd;
    }
  </style>

  <div class="mx-auto flex max-w-7xl flex-col items-center gap-2 px-4 py-6 text-center sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8 lg:text-left">
    <div class="footer-brand">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.</p>
      <div class="footer-meta">
        <div>Updated {{ "now" | date: "%A, %B %d, %Y %I:%M %p %Z" }}</div>
        <div>Built: {{ site.time | date: '%Y-%m-%d %H:%M:%S' }}</div>
      </div>
    </div>
  </div>
</footer>
