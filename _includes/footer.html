<footer class="page__footer">
  <style>
    .page__footer {
      width: 100%;
      background-color: #ffffff;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      margin-top: auto;
      padding: 2rem clamp(1rem, 4vw, 4rem);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1d2431;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    .page__footer-copyright {
      max-width: 1400px;
      margin: 0 auto;
    }

    .footer__columns {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .footer__column {
      font-size: 0.85rem;
      color: #1d2431;
      line-height: 1.6;
      transition: color 0.3s ease;
    }

    .footer__column a {
      color: #7c6ee6;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer__column a:hover {
      color: #6854d6;
      text-decoration: underline;
    }

    /* Dark mode support */
    html[data-theme="dark"] .page__footer,
    html.dark .page__footer {
      background-color: #0f1419;
      border-top-color: rgba(255, 255, 255, 0.08);
      color: #f5f7fb;
    }

    html[data-theme="dark"] .footer__column,
    html.dark .footer__column {
      color: #f5f7fb;
    }

    html[data-theme="dark"] .footer__column a,
    html.dark .footer__column a {
      color: #a78bfa;
    }

    html[data-theme="dark"] .footer__column a:hover,
    html.dark .footer__column a:hover {
      color: #c4b5fd;
    }

    @media (max-width: 768px) {
      .page__footer {
        padding: 1.5rem clamp(1rem, 3vw, 1.5rem);
      }

      .footer__column {
        font-size: 0.8rem;
      }
    }
  </style>

  <div class="page__footer-copyright">
    <div class="footer__columns">
      <div class="footer__column footer__column--left">
        <div>© {{ "now" | date: "%Y" }} Yashwanth Pandi</div>
        <div style="font-size: 0.75rem; color: #9ca4af; margin-top: 0.5rem;">
          Updated {{ "now" | date: "%b %d, %Y %I:%M %p %Z" }}
        </div>
        <div style="margin-top: 1rem;">
          <a href="{{ base_path }}/privacy-policy/">Privacy Policy</a>
          <span style="margin: 0 0.5rem;">·</span>
          <a href="{{ base_path }}/sitemap/">Sitemap</a>
        </div>
      </div>
    </div>
  </div>
</footer>
