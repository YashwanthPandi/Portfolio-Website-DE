<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
<script src="{{ base_path }}/assets/js/schedule-redirect.js"></script>
<script>
function updateContent(htmlText, url) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, 'text/html');
  const newMain = doc.querySelector('#page-content');
  if (!newMain) return;

  const existing = document.getElementById('page-content');
  existing.innerHTML = newMain.innerHTML;

  document.title = doc.title || document.title;
  window.history.pushState({ url }, '', url);
  window.scrollTo(0, 0);

  if (typeof window.onSpaPageLoad === 'function') {
    window.onSpaPageLoad();
  }
}

async function handleInternalNavigation(event) {
  const target = event.target.closest('a');
  if (!target || target.target === '_blank' || target.hasAttribute('download')) return;

  // Ignore elements with role="button" (like theme toggle, spotify toggle)
  if (target.getAttribute('role') === 'button') return;

  // Intercept schedule links - open the popup instead of navigating
  if (target.href.includes('/schedule')) {
    event.preventDefault();
    const popupButton = document.getElementById('open-popup-button');
    if (popupButton) {
      popupButton.click();
    }
    return;
  }

  const url = new URL(target.href, window.location.origin);
  if (url.origin !== window.location.origin) return;
  if (url.pathname === window.location.pathname && url.search === window.location.search) return;

  event.preventDefault();

  try {
    const response = await fetch(url.href, { headers: { 'Accept': 'text/html' } });
    if (!response.ok) throw new Error('Network response was not OK');

    const text = await response.text();
    updateContent(text, url.href);
  } catch (error) {
    console.error('SPA navigation failed; falling back to full load:', error);
    window.location.href = url.href;
  }
}

window.addEventListener('popstate', event => {
  const href = (event.state && event.state.url) || window.location.href;
  fetch(href)
    .then(resp => resp.text())
    .then(text => updateContent(text, href))
    .catch(error => { console.error(error); window.location.href = href; });
});

document.addEventListener('DOMContentLoaded', () => {
  document.body.addEventListener('click', handleInternalNavigation);
  
  // Reinitialize search if present
  if (typeof window.initSearch === 'function') {
    window.initSearch();
  }
  
  // Dispatch custom event for page load
  window.dispatchEvent(new CustomEvent('spaPageLoad'));
});

// Also reinitialize search when SPA page changes
if (typeof window.onSpaPageLoad === 'undefined') {
  window.onSpaPageLoad = function() {
    if (typeof window.initSearch === 'function') {
      window.initSearch();
    }
  };
}
</script>
