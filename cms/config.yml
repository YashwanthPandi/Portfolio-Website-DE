backend:
  name: github
  repo: YashwanthPandi/Portfolio-Website-DE
  branch: prod
  base_url: https://decap-cms-auth.pandiyashwanth-8d9.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "Blogs"
    folder: "_posts"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    delete: true
    path: "{{year}}/{{month}}/{{year}}-{{month}}-{{day}}-{{slug}}"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Collection", name: "collection", widget: "hidden", default: "posts" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false, hint: "Example: /posts/2026/03/my-post/" }
      - { label: "Categories", name: "categories", widget: "list", required: false, default: ["posts"] }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "_projects"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Modified", name: "modified", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "External URL", name: "external_url", widget: "string", required: false }
      - { label: "GitHub URL", name: "github_url", widget: "string", required: false }
      - { label: "Download URL", name: "download_url", widget: "string", required: false }
      - label: "Header"
        name: "header"
        widget: "object"
        required: false
        fields:
          - { label: "Overlay Image", name: "overlay_image", widget: "image", required: false }
          - { label: "Overlay Filter", name: "overlay_filter", widget: "number", required: false, value_type: "float" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "talks"
    label: "Talks"
    folder: "_talks"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Collection", name: "collection", widget: "hidden", default: "talks" }
      - { label: "Type", name: "type", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "publications"
    label: "Publications"
    folder: "_publications"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "All Pages"
    folder: "_pages"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Layout", name: "layout", widget: "string", default: "single" }
      - { label: "Author Profile", name: "author_profile", widget: "boolean", required: false, default: true }
      - { label: "Redirect From", name: "redirect_from", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "site-sections"
    label: "Site Settings & Data"
    files:
      - label: "Homepage Hero Section"
        name: "hero-data"
        file: "_data/hero.yml"
        fields:
          - { label: "Status Banner", name: "status", widget: "string" }
          - { label: "Location Tag", name: "location", widget: "string" }
          - { label: "Name Heading Line 1", name: "heading_line1", widget: "string" }
          - { label: "Name Heading Line 2", name: "heading_line2", widget: "string" }
          - { label: "GitHub URL", name: "github_url", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin_url", widget: "string" }
          - { label: "Headline Copy", name: "copy", widget: "text" }
          - { label: "Hero Description", name: "description", widget: "text" }
          - { label: "Schedule Call Button Label", name: "schedule_call_text", widget: "string" }
          - { label: "View Projects Button Label", name: "view_projects_text", widget: "string" }
          - { label: "View Projects Button Link", name: "view_projects_url", widget: "string" }

      - label: "Resources List Data"
        name: "resources-data"
        file: "_data/resources.yml"
        fields:
          - label: "Resources"
            name: "resources"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }

      - label: "Top Navigation Links"
        name: "main-navigation"
        file: "_data/navigation.yml"
        fields:
          - label: "Main Navigation"
            name: "main"
            widget: "list"
            summary: "{{fields.title}} → {{fields.url}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

      - label: "Contact Settings"
        name: "contact-settings"
        file: "_data/contact.yml"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text" }
          - { label: "Email Address", name: "email", widget: "string" }
          - label: "Form Configuration"
            name: "form"
            widget: "object"
            fields:
              - { label: "Provider", name: "provider", widget: "string", default: "FormSubmit" }
              - { label: "Action URL", name: "action", widget: "string" }
              - { label: "Method", name: "method", widget: "string", default: "POST" }
              - { label: "Success Message", name: "success_message", widget: "string", required: false }

      - label: "Contact Page File"
        name: "contact-page"
        file: "_pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
          - { label: "Author Profile", name: "author_profile", widget: "boolean", default: false, required: false }

      - label: "Resume Page File"
        name: "resume-page"
        file: "_pages/resume.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "archive" }
          - { label: "Author Profile", name: "author_profile", widget: "boolean", default: true, required: false }
          - { label: "Body", name: "body", widget: "markdown", required: false }

      - label: "Privacy Policy Page"
        name: "privacy-policy-page"
        file: "_pages/privacy-policy.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Modified Date", name: "modified", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Terms of Service Page"
        name: "terms-page"
        file: "_pages/terms.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Modified Date", name: "modified", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "Body", name: "body", widget: "markdown" }