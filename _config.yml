# Welcome to Jekyll!
# Site-wide settings for Yashwanth Pandi's Portfolio

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Yashwanth Pandi"
title_separator          : "-"
name                     : &name "Yashwanth Pandi"
description              : &description "Academic portfolio and personal website of Yashwanth Pandi."
url                      : "https://yashwanth.co.in" # Change 'yashwanth-pandi' to your actual username
baseurl                  : "" 
repository               : "https://github.com/YashwanthPandi/PrivateWebsite/"

# Site Author - Sidebar Configuration
author:
  avatar           : "profile.png" # Place your photo in /images/profile.png
  name             : "Yashwanth Pandi"
  pronouns         : 
  bio              : "Data Scientist & Engineer"
  location         : "San Francisco"
  employer         : "California Lutheran University"
  uri              : 
  email            : "pandiyashwanth@gmail.com" 

  # # Academic websites
  # googlescholar    : "" # Add your scholar ID here
  # orcid            : "" # Add your ORCID URL
  # researchgate     : ""

  # Repositories and software development
  github           : "yashwanthpandi" # Your GitHub username
  stackoverflow    : ""    

  # # Social media
  # linkedin         : "" # Your LinkedIn username
  # twitter          : ""
  # instagram        : ""

# # Publication Category Headings
# publication_category:
#   books:
#     title: 'Books'
#   manuscripts:
#     title: 'Journal Articles'    
#   conferences:
#     title: 'Conference Papers'

# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion & Markdown Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections (Portfolios, Talks, Publications)
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Default Layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development