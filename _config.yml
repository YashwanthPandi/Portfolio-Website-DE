# Welcome to Jekyll!
# Site-wide settings for Yashwanth Pandi's Portfolio

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Yashwanth Pandi"
title_separator          : "-"
name                     : "Yashwanth Pandi"
description              : "Academic portfolio and personal website of Yashwanth Pandi."
url                      : "https://yashwanth.co.in" 
baseurl                  : "" 
repository               : "https://github.com/YashwanthPandi/PrivateWebsite/"

# Server Settings
port: 4000 # Fixes the "Address already in use" error by defaulting to 4001

# Site Author - Sidebar Configuration
author:
  avatar           : "profile.png"
  name             : "Yashwanth Pandi"
  pronouns         : 
  bio              : "Data Scientist & Engineer"
  location         : "San Francisco, CA"
  employer         : "California Lutheran University"
  uri              : 
  email            : "pandiyashwanth@gmail.com" 
  github           : "yashwanthpandi"
  stackoverflow    : ""    

# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion & Markdown Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Default Layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  style: compressed
  quiet_deps: true # This silences the "@import is deprecated" warnings

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
  - jekyll-admin

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development