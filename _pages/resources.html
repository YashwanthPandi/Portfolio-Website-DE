---
layout: archive
title: "Resources"
permalink: /resources/
author_profile: true
---

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    
    {% for res in site.data.resources %}
    <div class="col">
      <div class="card h-100 shadow-sm border-0">
        {% if res.image %}
        <img src="{{ res.image }}" class="card-img-top p-3" alt="{{ res.name }}" style="height: 180px; object-fit: contain; background: #f8f9fa;">
        {% endif %}
        
        <div class="card-body">
          <div class="mb-2">
            <span class="badge bg-secondary opacity-75 small">{{ res.tag }}</span>
          </div>
          <h5 class="card-title"><strong>{{ res.name }}</strong></h5>
          <p class="card-text text-muted small">{{ res.desc }}</p>
        </div>
        
        <div class="card-footer bg-transparent border-0 pb-3">
          <a href="{{ res.link }}" class="btn btn-primary btn-sm w-100" target="_blank">View Resource</a>
        </div>
      </div>
    </div>
    {% endfor %}

  </div>
</div>

<style>
  /* Prevents theme styles from breaking card alignment */
  .card-body { padding: 1.25rem; }
  .card-title { margin-bottom: 0.5rem; color: #333; }
  .btn-primary { background-color: #007bff; border: none; }
  .btn-primary:hover { background-color: #0056b3; }
</style>
