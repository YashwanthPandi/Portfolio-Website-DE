---
layout: archive
title: "Resources"
permalink: /resources/
author_profile: true
---

<div class="res-section">
  <div class="res-list">
    {% for res in site.data.resources %}
    <a href="{{ res.link }}" class="res-item" target="_blank">
      {% if res.image %}
      <div class="res-thumb">
        <img src="{{ res.image }}" alt="{{ res.name }}" onerror="this.style.display='none'">
      </div>
      {% endif %}
      
      <div class="res-info">
        <div class="res-meta">
          <span class="res-name">{{ res.name }}</span>
          <span class="res-tag">{{ res.tag }}</span>
        </div>
        <p class="res-desc">{{ res.desc }}</p>
      </div>
      
      <div class="res-arrow">→</div>
    </a>
    {% endfor %}
  </div>
</div>

<style>
  .res-section { margin: 2rem 0; }

  .res-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem; /* Tight spacing between items */
  }

  .res-item {
    display: flex;
    align-items: center;
    padding: 0.75rem 1rem;
    text-decoration: none !important;
    background: var(--background-color, transparent);
    border: 1px solid var(--border-color, rgba(128,128,128,0.2));
    border-radius: 6px;
    transition: all 0.2s ease;
    color: inherit !important; /* Forces theme text color */
  }

  .res-item:hover {
    background: rgba(128, 128, 128, 0.05);
    border-color: var(--primary-color, #007bff);
    transform: translateX(4px);
  }

  /* Compact Thumbnail */
  .res-thumb {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    margin-right: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .res-thumb img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Text Content */
  .res-info { flex-grow: 1; }

  .res-meta {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 0.2rem;
  }

  .res-name {
    font-weight: 700;
    font-size: 1.05rem;
  }

  .res-tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.6;
    font-weight: bold;
  }

  .res-desc {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.7;
    line-height: 1.3;
  }

  .res-arrow {
    margin-left: 1rem;
    opacity: 0.3;
    font-weight: bold;
  }

  .res-item:hover .res-arrow {
    opacity: 1;
    color: var(--primary-color, #007bff);
  }

  /* Mobile adjustment */
  @media (max-width: 600px) {
    .res-meta { flex-direction: column; gap: 0; }
  }
</style>
